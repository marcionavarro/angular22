<div class="row">
  <div class="col-3">
    {{ employeeName }}
  </div>
  <div class="col-3">signal => {{ empMobileNo() }}</div>
  <div class="col-3">isActive = {{ isActive() }}</div>
  <div class="col-3">
    <ul>
      @for (city of cityListSignal(); track $index) {
        <li>{{ city }}</li>
      }
    </ul>
  </div>
</div>

<hr />

<div class="row">
  <div class="col-3">
    <button class="btn btn-success" (click)="changeEmpName()">Alterar nome do funcionário</button>
  </div>
  <div class="col-3">
    <button class="btn btn-success" (click)="changeMobile()">Alterar celular</button>
  </div>
</div>
